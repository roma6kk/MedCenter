# MedCenter development stack (Task 001, M0).
# NFR-001 (>= 6 containers) is met at M7 when the 8 BFF services are added here;
# this M0 slice ships the infrastructure containers the plan's Task 4 defines.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medcenter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medcenter
    # Host port is overridable: a developer machine may already run PostgreSQL on 5432.
    ports: ['${POSTGRES_PORT:-5432}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medcenter']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      retries: 10

  hapi:
    image: hapiproject/hapi:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/medcenter
      SPRING_DATASOURCE_USERNAME: medcenter
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # The starter pins spring.datasource.driver-class-name to H2; the URL
      # override alone is not enough (H2 refuses jdbc:postgresql).
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # Without this Hibernate keeps the H2 dialect and emits
      # `select next value for ...` which PostgreSQL rejects.
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy
    ports: ['8080:8080'] # dev only — never published publicly in prod

  traefik:
    image: traefik:v3
    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.file.directory=/etc/traefik/dynamic'
      - '--entrypoints.websecure.address=:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    ports: ['443:443']

  # Task 001 implementation: the only BFF service built so far. Mounted behind
  # Traefik on /oauth, /.well-known and /api/v1/auth* once the container is up.
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    env_file: .env
    ports:
      - '3001:3001' # dev only — production uses Traefik; do not expose in prod
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # Lightweight readiness probe: /oauth/authorize is public and returns 302
      # once Nest has bound the port. The probe ignores the redirect target so
      # a missing FHIR/host does not make the container unhealthy.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/oauth/authorize').then(r => { if (r.status !== 302) process.exit(1); })\" || exit 1"]
      interval: 10s
      retries: 30
      start_period: 60s
