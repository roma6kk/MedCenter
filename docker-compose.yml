x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }

x-base: &base
  restart: unless-stopped
  security_opt: ['no-new-privileges:true']
  logging: *logging

x-bff-build: &bff-build
  context: .
  dockerfile: infra/docker/nest-service.Dockerfile

x-bff-env: &bff-env
  NODE_ENV: production
  FHIR_BASE_URL: http://hapi:8080/fhir
  REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
  JWT_JWKS_URI: http://auth-service:3001/.well-known/jwks.json
  JWT_ISSUER: ${JWT_ISSUER:-http://medcenter.localhost:8081}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
  CONSENT_ENFORCEMENT: ${CONSENT_ENFORCEMENT:-block}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  # Browser calls reach a BFF through two trusted proxies: the web container's /api/v1 rewrite and Traefik.
  TRUST_PROXY: '2'
  FHIR_CLIENT_ID:
  FHIR_CLIENT_SECRET:
  FHIR_TIMEOUT_MS:

x-mq-env: &mq-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_USERNAME: medcenter
  DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  DB_NAME: medcenter

x-bff-healthcheck: &bff-healthcheck
  test:
    - CMD
    - node
    - -e
    - >-
      fetch('http://127.0.0.1:' + process.env.PORT + (process.env.HEALTH_PATH || '/health'),
      { signal: AbortSignal.timeout(4000) })
      .then((r) => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-bff: &bff
  <<: *base
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  mem_limit: 512m
  pids_limit: 256
  networks: [backend, data]
  healthcheck: *bff-healthcheck

# No BFF depends on auth-service: the JWKS is fetched lazily, so an auth outage must not block the stack.
x-dep-hapi: &dep-hapi
  hapi:
    condition: service_started # distroless image: no shell for a healthcheck
x-dep-redis: &dep-redis
  redis:
    condition: service_healthy
x-dep-rabbitmq: &dep-rabbitmq
  rabbitmq:
    condition: service_healthy
x-dep-postgres: &dep-postgres
  postgres:
    condition: service_healthy

services:
  postgres:
    <<: *base
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: medcenter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: medcenter
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    ports: ['127.0.0.1:${POSTGRES_PORT:-5432}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medcenter']
      interval: 5s
      retries: 10

  redis:
    <<: *base
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    # AOF keeps the token denylist across restarts; `redis-server` must stay first for the image's user drop.
    command: [redis-server, --appendonly, 'yes', --requirepass, '${REDIS_PASSWORD:-}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    networks: [data]
    # 6380 by default: another container on this machine already owns 6379.
    ports: ['127.0.0.1:${REDIS_HOST_PORT:-6380}:6379']
    healthcheck:
      test:
        - CMD-SHELL
        - 'if [ -n "$$REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$$REDIS_PASSWORD"; fi; redis-cli ping | grep -q PONG'
      interval: 5s
      retries: 10

  rabbitmq:
    <<: *base
    image: rabbitmq:3.13.7-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks: [data]
    ports: ['127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      retries: 10

  hapi:
    <<: *base
    image: hapiproject/hapi:v8.12.0-2@sha256:0ff86aac4c7bd13a1ee226444a70263bb46ed1c28ef543c30a44f865b80ca04e
    cap_drop: [ALL]
    mem_limit: 3g
    pids_limit: 1024
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/medcenter
      SPRING_DATASOURCE_USERNAME: medcenter
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # The image pins the H2 driver and dialect; both must be overridden for PostgreSQL.
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0
      HAPI_FHIR_EXPUNGE_ENABLED: 'true'
    depends_on:
      <<: *dep-postgres
    networks: [backend, data]
    # HAPI has no authentication: Traefik exposes only GET /fhir/metadata; the loopback port serves host-run seeds.
    ports: ['127.0.0.1:8080:8080']

  traefik:
    <<: *base
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    command:
      - '--global.checknewversion=false'
      - '--global.sendanonymoususage=false'
      # File provider only, no docker.sock: a compromised edge must not drive the Docker daemon.
      - '--providers.file.directory=/etc/traefik/dynamic'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.websecure.http.tls=true'
      - '--entrypoints.web.address=:8081'
      # X-Forwarded-For is kept only from the web container's pinned address (web.networks.edge.ipv4_address).
      - '--entrypoints.web.forwardedHeaders.trustedIPs=172.31.250.10/32'
      - '--entrypoints.websecure.forwardedHeaders.trustedIPs=172.31.250.10/32'
      - '--ping=true'
    volumes:
      # The directory, not the file: a rename-on-save would orphan a single-file bind mount.
      - ./infra/traefik:/etc/traefik/dynamic:ro
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    pids_limit: 512
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      backend: {}
      edge:
        # Lets the web container reach Traefik under the same auth host the browser uses.
        aliases: [medcenter.localhost]
    ports: ['127.0.0.1:443:443', '127.0.0.1:8081:8081']

  auth-service:
    <<: *bff
    build:
      <<: *bff-build
      args: { APP: auth-service, PORT: '3001' }
    # The only container with the whole .env: signing keys, OAuth client registry, session secret, bootstrap admin.
    env_file: .env
    environment:
      <<: [*bff-env, *db-env]
      PORT: '3001'
      HEALTH_PATH: /.well-known/jwks.json
      # Minutes without user activity before the refresh token stops working; the web build reads the same value for its client-side timer.
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-15}
      RETENTION_ACCOUNT_DAYS: ${RETENTION_ACCOUNT_DAYS:-1825}
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      <<: [*dep-postgres, *dep-redis]

  practitioner-service:
    <<: *bff
    build:
      <<: *bff-build
      args: { APP: practitioner-service, PORT: '3002' }
    environment:
      <<: *bff-env
      PORT: '3002'
      HEALTH_PATH: /health
    depends_on:
      <<: [*dep-hapi, *dep-redis]

  catalog-service:
    <<: *bff
    build:
      <<: *bff-build
      args: { APP: catalog-service, PORT: '3003' }
    environment:
      <<: *bff-env
      PORT: '3003'
      HEALTH_PATH: /health
    depends_on:
      <<: [*dep-hapi, *dep-redis]

  patient-service:
    <<: *bff
    build:
      <<: *bff-build
      args: { APP: patient-service, PORT: '3004' }
    environment:
      <<: *bff-env
      PORT: '3004'
      HEALTH_PATH: /health
    depends_on:
      <<: [*dep-hapi, *dep-redis]

  appointment-service:
    <<: *bff
    build:
      <<: *bff-build
      args: { APP: appointment-service, PORT: '3005' }
    environment:
      <<: *bff-env
      PORT: '3005'
      HEALTH_PATH: /health
    depends_on:
      <<: [*dep-hapi, *dep-redis]

  notification-service:
    <<: *bff
    build:
      <<: *bff-build
      args: { APP: notification-service, PORT: '3006' }
    environment:
      <<: [*bff-env, *mq-env]
      PORT: '3006'
      HEALTH_PATH: /health
      CONSUMER_ENABLED: 'true'
    depends_on:
      <<: [*dep-hapi, *dep-redis, *dep-rabbitmq]

  encounter-service:
    <<: *bff
    build:
      <<: *bff-build
      args: { APP: encounter-service, PORT: '3007' }
    environment:
      <<: *bff-env
      PORT: '3007'
      HEALTH_PATH: /health
    depends_on:
      <<: [*dep-hapi, *dep-redis]

  analytics-service:
    <<: *bff
    build:
      <<: *bff-build
      args: { APP: analytics-service, PORT: '3008' }
    environment:
      <<: [*bff-env, *mq-env, *db-env]
      PORT: '3008'
      HEALTH_PATH: /health
      AUDIT_SYNC_ENABLED:
      AUDIT_SYNC_INTERVAL_MS:
    depends_on:
      <<: [*dep-hapi, *dep-redis, *dep-rabbitmq, *dep-postgres]

  outbox-relay:
    <<: *bff
    build:
      <<: *bff-build
      args: { APP: outbox-relay, PORT: '3009' }
    environment:
      <<: [*bff-env, *mq-env]
      PORT: '3009'
      HEALTH_PATH: /health
      OUTBOX_POLL_INTERVAL_MS:
      OUTBOX_BATCH_SIZE:
      OUTBOX_LOCK_TTL_MS:
      OUTBOX_HOUSEKEEPING_INTERVAL_MS:
      OUTBOX_STALE_PENDING_MS:
      OUTBOX_RETENTION_DAYS:
      OUTBOX_RETENTION_MS:
    depends_on:
      <<: [*dep-hapi, *dep-redis, *dep-rabbitmq]

  web:
    <<: *base
    build:
      context: ./frontend
      dockerfile: ../infra/docker/web.Dockerfile
      args:
        # Baked in at build time (the /api/v1 rewrite and inlined NEXT_PUBLIC_*): changing it needs a rebuild.
        NEXT_PUBLIC_API_URL: http://traefik:8081
        NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-15}
    # No env_file: a public PKCE client needs none of the backend secrets.
    environment:
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      # Used by the browser redirect and by the server-side token calls, so it must resolve on both sides.
      AUTH_BACKEND_URL: http://medcenter.localhost:8081
      OAUTH_CLIENT_ID: ${WEB_OAUTH_CLIENT_ID:-medcenter-web}
    cap_drop: [ALL]
    read_only: true
    # Next writes its fetch/ISR cache to .next/cache at runtime (owned by `node`, uid 1000).
    tmpfs: ['/tmp', '/app/.next/cache:uid=1000,gid=1000']
    mem_limit: 512m
    pids_limit: 256
    networks:
      edge:
        # The address Traefik trusts for X-Forwarded-For (forwardedHeaders.trustedIPs above).
        ipv4_address: 172.31.250.10
    ports:
      # OAuth redirect_uri is http://localhost:3000/api/auth/callback — register exactly that.
      - '127.0.0.1:3000:3000'
    depends_on:
      traefik:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/auth/session', { signal: AbortSignal.timeout(4000) })
          .then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  edge:
    ipam:
      config:
        - subnet: 172.31.250.0/24
  backend: {}
  data: {}

volumes:
  pgdata: {}
  redisdata: {}
  rabbitmqdata: {}
