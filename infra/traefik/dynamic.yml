# HAPI has no authentication: the edge publishes only GET /fhir/metadata, every other /fhir/** path gets a 404.

http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        # No `browserXssFilter`: it emits the deprecated `X-XSS-Protection: 1; mode=block`.
        referrerPolicy: strict-origin-when-cross-origin
        # Framing only: the auth-service login page must keep working; the web client sets its own full CSP.
        contentSecurityPolicy: "frame-ancestors 'none'"
        permissionsPolicy: camera=(), microphone=(), geolocation=(), payment=()
        # An empty value deletes the header (hides `X-Powered-By: Express`).
        customResponseHeaders:
          X-Powered-By: ''

    # The public HAPI route has no BFF rate limiter in front of it.
    fhir-metadata-limit:
      rateLimit:
        average: 60
        period: 1m
        burst: 20

    # Dropping the client's cache headers keeps HAPI from rebuilding its large CapabilityStatement per call.
    fhir-metadata-cache:
      headers:
        customRequestHeaders:
          Cache-Control: ''
          Pragma: ''

  routers:
    fhir-metadata:
      rule: Path(`/fhir/metadata`) && Method(`GET`)
      entryPoints: [websecure, web]
      service: hapi
      middlewares: [security-headers, fhir-metadata-limit, fhir-metadata-cache]

    auth-edge:
      rule: PathPrefix(`/oauth`) || PathPrefix(`/.well-known`)
      entryPoints: [websecure, web]
      service: auth-service
      middlewares: [security-headers]

    auth-api:
      rule: PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/terminology`) || PathPrefix(`/api/v1/admin/users`) || PathPrefix(`/api/v1/admin/terminology`) || Path(`/api/v1/me`) || Path(`/api/v1/me/deactivate`) || Path(`/api/v1/me/password`)
      priority: 40
      entryPoints: [websecure, web]
      service: auth-service
      middlewares: [security-headers]

    analytics:
      rule: PathPrefix(`/api/v1/admin/analytics`) || PathPrefix(`/api/v1/admin/audit`)
      entryPoints: [websecure, web]
      service: analytics-service
      middlewares: [security-headers]

    catalog-admin:
      rule: PathPrefix(`/api/v1/admin/schedules`) || PathPrefix(`/api/v1/admin/services`)
      entryPoints: [websecure, web]
      service: catalog-service
      middlewares: [security-headers]

    practitioner-rooms-admin:
      rule: PathPrefix(`/api/v1/admin/rooms`)
      entryPoints: [websecure, web]
      service: practitioner-service
      middlewares: [security-headers]

    practitioner-doctors:
      rule: PathPrefix(`/api/v1/doctors`) || PathPrefix(`/api/v1/rooms`)
      priority: 50
      entryPoints: [websecure, web]
      service: practitioner-service
      middlewares: [security-headers]

    catalog-doctor-slots:
      rule: PathPrefix(`/api/v1/doctor/schedule`) || PathPrefix(`/api/v1/services`) || PathRegexp(`^/api/v1/doctors/[^/]+/slots$`)
      priority: 60
      entryPoints: [websecure, web]
      service: catalog-service
      middlewares: [security-headers]

    appointment-doctor:
      rule: PathPrefix(`/api/v1/doctor/appointments`)
      priority: 60
      entryPoints: [websecure, web]
      service: appointment-service
      middlewares: [security-headers]

    appointments:
      rule: PathPrefix(`/api/v1/appointments`)
      entryPoints: [websecure, web]
      service: appointment-service
      middlewares: [security-headers]

    encounters:
      rule: PathPrefix(`/api/v1/encounters`)
      entryPoints: [websecure, web]
      service: encounter-service
      middlewares: [security-headers]

    encounter-me:
      rule: PathPrefix(`/api/v1/me/history`) || PathPrefix(`/api/v1/me/prescriptions`)
      priority: 40
      entryPoints: [websecure, web]
      service: encounter-service
      middlewares: [security-headers]

    encounter-patient-history:
      rule: PathRegexp(`^/api/v1/patients/[^/]+/(history|prescriptions)$`)
      priority: 60
      entryPoints: [websecure, web]
      service: encounter-service
      middlewares: [security-headers]

    patient-me:
      rule: Path(`/api/v1/me/patient`) || PathPrefix(`/api/v1/me/consent`)
      priority: 40
      entryPoints: [websecure, web]
      service: patient-service
      middlewares: [security-headers]

    patients:
      rule: PathPrefix(`/api/v1/patients`)
      priority: 50
      entryPoints: [websecure, web]
      service: patient-service
      middlewares: [security-headers]

    notifications:
      rule: PathPrefix(`/api/v1/notifications`)
      entryPoints: [websecure, web]
      service: notification-service
      middlewares: [security-headers]

    docs-auth:
      rule: PathPrefix(`/api/docs/auth`)
      priority: 70
      entryPoints: [websecure, web]
      service: auth-service
      middlewares: [security-headers]

    docs-practitioner:
      rule: PathPrefix(`/api/docs/practitioner`)
      priority: 70
      entryPoints: [websecure, web]
      service: practitioner-service
      middlewares: [security-headers]

    docs-catalog:
      rule: PathPrefix(`/api/docs/catalog`)
      priority: 70
      entryPoints: [websecure, web]
      service: catalog-service
      middlewares: [security-headers]

    docs-patient:
      rule: PathPrefix(`/api/docs/patient`)
      priority: 70
      entryPoints: [websecure, web]
      service: patient-service
      middlewares: [security-headers]

    docs-appointment:
      rule: PathPrefix(`/api/docs/appointment`)
      priority: 70
      entryPoints: [websecure, web]
      service: appointment-service
      middlewares: [security-headers]

    docs-notification:
      rule: PathPrefix(`/api/docs/notification`)
      priority: 70
      entryPoints: [websecure, web]
      service: notification-service
      middlewares: [security-headers]

    docs-encounter:
      rule: PathPrefix(`/api/docs/encounter`)
      priority: 70
      entryPoints: [websecure, web]
      service: encounter-service
      middlewares: [security-headers]

    docs-analytics:
      rule: PathPrefix(`/api/docs/analytics`)
      priority: 70
      entryPoints: [websecure, web]
      service: analytics-service
      middlewares: [security-headers]

  services:
    hapi:
      loadBalancer:
        servers:
          - url: http://hapi:8080

    auth-service:
      loadBalancer:
        servers:
          - url: http://auth-service:3001

    practitioner-service:
      loadBalancer:
        servers:
          - url: http://practitioner-service:3002

    catalog-service:
      loadBalancer:
        servers:
          - url: http://catalog-service:3003

    patient-service:
      loadBalancer:
        servers:
          - url: http://patient-service:3004

    appointment-service:
      loadBalancer:
        servers:
          - url: http://appointment-service:3005

    notification-service:
      loadBalancer:
        servers:
          - url: http://notification-service:3006

    encounter-service:
      loadBalancer:
        servers:
          - url: http://encounter-service:3007

    analytics-service:
      loadBalancer:
        servers:
          - url: http://analytics-service:3008
