# Traefik edge routing (file provider) — ADR-009: Traefik performs NO token
# validation; it terminates TLS, applies security headers and passes the
# `x-request-id` header through. Every BFF validates JWT/scopes/RBAC itself.
#
# Service ports: auth 3001, practitioner 3002, catalog 3003, patient 3004,
# appointment 3005, notification 3006, encounter 3007, analytics 3008.
# Every backend is the docker-compose container of the same name on the `backend`
# network (`http://<service>:<port>`); a router whose container is not running
# answers 502. The web app (Next.js) is NOT routed here: it is published on
# host port 3000 and proxies `/api/v1/*` to this edge (see docker-compose.yml).
# Every `/api/v1/**` controller route of the 8 services must map to exactly one
# router below; the mapping was audited route by route (tasks/TASK-001/coder-stack-fixes-report.md).
#
# HAPI FHIR has NO authentication and is not a BFF, so ADR-009 does not cover it:
# the edge publishes exactly one HAPI endpoint, `GET /fhir/metadata`
# (CapabilityStatement, NFR-010; specs/api-designer-spec.md). Every other
# `/fhir/**` path and method gets Traefik's own 404. BFFs reach HAPI directly at
# http://hapi:8080/fhir on the compose network.

http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        # No `browserXssFilter`: it emits the deprecated `X-XSS-Protection: 1; mode=block`
        # (OWASP: omit it or send 0), and modern browsers ignore the header anyway.
        referrerPolicy: strict-origin-when-cross-origin
        # Only framing is restricted: the auth-service login page (HTML) must keep
        # working, so no `default-src` here. The web client sets its own full CSP.
        contentSecurityPolicy: "frame-ancestors 'none'"
        permissionsPolicy: camera=(), microphone=(), geolocation=(), payment=()
        # An empty value deletes the header: hides the `X-Powered-By: Express`
        # fingerprint the BFFs send.
        customResponseHeaders:
          X-Powered-By: ''

  routers:
    fhir-metadata:
      rule: Path(`/fhir/metadata`) && Method(`GET`)
      entryPoints: [websecure, web]
      service: hapi
      middlewares: [security-headers]

    auth-edge:
      rule: PathPrefix(`/oauth`) || PathPrefix(`/.well-known`)
      entryPoints: [websecure, web]
      service: auth-service
      middlewares: [security-headers]

    auth-api:
      rule: PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/terminology`) || PathPrefix(`/api/v1/admin/users`) || PathPrefix(`/api/v1/admin/terminology`) || Path(`/api/v1/me`)
      priority: 40
      entryPoints: [websecure, web]
      service: auth-service
      middlewares: [security-headers]

    analytics:
      rule: PathPrefix(`/api/v1/admin/analytics`) || PathPrefix(`/api/v1/admin/audit`)
      entryPoints: [websecure, web]
      service: analytics-service
      middlewares: [security-headers]

    catalog-admin:
      rule: PathPrefix(`/api/v1/admin/schedules`) || PathPrefix(`/api/v1/admin/services`)
      entryPoints: [websecure, web]
      service: catalog-service
      middlewares: [security-headers]

    practitioner-rooms-admin:
      rule: PathPrefix(`/api/v1/admin/rooms`)
      entryPoints: [websecure, web]
      service: practitioner-service
      middlewares: [security-headers]

    practitioner-doctors:
      rule: PathPrefix(`/api/v1/doctors`) || PathPrefix(`/api/v1/rooms`)
      priority: 50
      entryPoints: [websecure, web]
      service: practitioner-service
      middlewares: [security-headers]

    catalog-doctor-slots:
      rule: PathPrefix(`/api/v1/doctor/schedule`) || PathPrefix(`/api/v1/services`) || PathRegexp(`^/api/v1/doctors/[^/]+/slots$`)
      priority: 60
      entryPoints: [websecure, web]
      service: catalog-service
      middlewares: [security-headers]

    appointment-doctor:
      rule: PathPrefix(`/api/v1/doctor/appointments`)
      priority: 60
      entryPoints: [websecure, web]
      service: appointment-service
      middlewares: [security-headers]

    appointments:
      rule: PathPrefix(`/api/v1/appointments`)
      entryPoints: [websecure, web]
      service: appointment-service
      middlewares: [security-headers]

    encounters:
      rule: PathPrefix(`/api/v1/encounters`)
      entryPoints: [websecure, web]
      service: encounter-service
      middlewares: [security-headers]

    encounter-me:
      rule: PathPrefix(`/api/v1/me/history`) || PathPrefix(`/api/v1/me/prescriptions`)
      priority: 40
      entryPoints: [websecure, web]
      service: encounter-service
      middlewares: [security-headers]

    encounter-patient-history:
      rule: PathRegexp(`^/api/v1/patients/[^/]+/(history|prescriptions)$`)
      priority: 60
      entryPoints: [websecure, web]
      service: encounter-service
      middlewares: [security-headers]

    patient-me:
      rule: Path(`/api/v1/me/patient`)
      priority: 40
      entryPoints: [websecure, web]
      service: patient-service
      middlewares: [security-headers]

    patients:
      rule: PathPrefix(`/api/v1/patients`)
      priority: 50
      entryPoints: [websecure, web]
      service: patient-service
      middlewares: [security-headers]

    notifications:
      rule: PathPrefix(`/api/v1/notifications`)
      entryPoints: [websecure, web]
      service: notification-service
      middlewares: [security-headers]

  services:
    hapi:
      loadBalancer:
        servers:
          - url: http://hapi:8080

    auth-service:
      loadBalancer:
        servers:
          - url: http://auth-service:3001

    practitioner-service:
      loadBalancer:
        servers:
          - url: http://practitioner-service:3002

    catalog-service:
      loadBalancer:
        servers:
          - url: http://catalog-service:3003

    patient-service:
      loadBalancer:
        servers:
          - url: http://patient-service:3004

    appointment-service:
      loadBalancer:
        servers:
          - url: http://appointment-service:3005

    notification-service:
      loadBalancer:
        servers:
          - url: http://notification-service:3006

    encounter-service:
      loadBalancer:
        servers:
          - url: http://encounter-service:3007

    analytics-service:
      loadBalancer:
        servers:
          - url: http://analytics-service:3008
